# H2 Database Configuration for local development (Standalone zero-setup mode)
spring.datasource.url=jdbc:h2:file:./data/legal_cms_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=varsha0512

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Secret & Seed
app.jwt.secret=LegalCmsGovGujaratSecretKey2026SecureJwtAuthenticationSignatureString384BitAtLeast
app.jwt.expiration-ms=86400000
app.upload.dir=./uploads/bills
app.seed.enabled=true
