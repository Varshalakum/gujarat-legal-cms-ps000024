spring.application.name=legal-case-management

# Server Configuration
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/

# Database Configuration (MySQL) with Environment Variable Overrides
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/legal_cms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=${UPLOAD_DIR:./uploads/bills}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:LegalCmsGovGujaratSecretKey2026SecureJwtAuthenticationSignatureString384BitAtLeast}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dev Seeding Toggle (Bypassed if set to false or in production)
app.seed.enabled=${APP_SEED_ENABLED:true}

# Logging
logging.level.com.legalcms=INFO
logging.level.org.springframework.security=WARN

